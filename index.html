<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics (gtag.js) — loads on all routes; Vite SPA serves this single index.html -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-67GM94NLLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-67GM94NLLW');
    </script>

    <title>TapeOutOps | Enterprise Sign-off Infrastructure for ASIC &amp; SoC Teams</title>
    <meta
      name="description"
      content="TapeOutOps is enterprise sign-off infrastructure for ASIC and SoC teams—specs, SpecLint, DRC/LVS checklists, vendor handoffs, and audit trails with gated access."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.tapeoutops.com/" />

    <!-- Open Graph / LinkedIn / WhatsApp link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tapeoutops.com/" />
    <meta property="og:site_name" content="TapeOutOps" />
    <meta property="og:title" content="TapeOutOps | Enterprise Sign-off Infrastructure for ASIC &amp; SoC Teams" />
    <meta
      property="og:description"
      content="Gated tapeout operations for semiconductor teams: specifications, SpecLint, checklist sign-offs, vendor collaboration, and audit trails—deployable in a private VPC."
    />
    <meta property="og:image" content="https://www.tapeoutops.com/og-share.png" />
    <meta property="og:image:alt" content="TapeOutOps enterprise tapeout workflow platform" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TapeOutOps | Enterprise Sign-off Infrastructure for ASIC &amp; SoC Teams" />
    <meta
      name="twitter:description"
      content="Enterprise sign-off infrastructure for ASIC &amp; SoC teams—specs, checklists, SpecLint, and vendor handoffs with gated access."
    />
    <meta name="twitter:image" content="https://www.tapeoutops.com/og-share.png" />

    <!-- Fonts: load without blocking document parse/paint (blocked Google Fonts = endless tab spinner on some networks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <!-- Theme: dark-only (must match src/utils/theme.ts) -->
    <script>
      (function () {
        var root = document.documentElement
        localStorage.theme = 'dark'
        root.classList.add('dark')
        root.style.backgroundColor = '#0e0e0e'
        root.style.colorScheme = 'dark'
      })()
    </script>
  </head>
  <body class="min-h-screen bg-dark-950 text-gray-100 antialiased">
    <div id="app" class="min-h-screen bg-dark-950"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
