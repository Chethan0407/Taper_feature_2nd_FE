<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics (gtag.js) — loads on all routes; Vite SPA serves this single index.html -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-67GM94NLLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-67GM94NLLW');
    </script>

    <title>TapeOutOps - Streamline Your Tapeout Workflow</title>
    <meta name="description" content="Professional tapeout workflow management platform for semiconductor design teams" />
    
    <!-- Fonts: load without blocking document parse/paint (blocked Google Fonts = endless tab spinner on some networks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <!-- Theme: dark-only (must match src/utils/theme.ts) -->
    <script>
      (function () {
        var root = document.documentElement
        localStorage.theme = 'dark'
        root.classList.add('dark')
        root.style.backgroundColor = '#0e0e0e'
        root.style.colorScheme = 'dark'
      })()
    </script>
  </head>
  <body class="min-h-screen bg-dark-950 text-gray-100 antialiased">
    <div id="app" class="min-h-screen bg-dark-950"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
