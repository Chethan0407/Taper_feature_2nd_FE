<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics (gtag.js) — loads on all routes; Vite SPA serves this single index.html -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-67GM94NLLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-67GM94NLLW');
    </script>

    <title>TapeOutOps - Streamline Your Tapeout Workflow</title>
    <meta name="description" content="Professional tapeout workflow management platform for semiconductor design teams" />
    
    <!-- Fonts: load without blocking document parse/paint (blocked Google Fonts = endless tab spinner on some networks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <!-- Theme: dark-only (must match src/utils/theme.ts) -->
    <script>
      (function () {
        var root = document.documentElement
        localStorage.theme = 'dark'
        root.classList.add('dark')
        root.style.backgroundColor = '#0e0e0e'
        root.style.colorScheme = 'dark'
      })()
    </script>
  </head>
  <body class="min-h-screen bg-dark-950 text-gray-100 antialiased">
    <!--
      If you only see this block (no app UI), JS did not boot: check DevTools → Console, disable extensions,
      hard refresh (Cmd+Shift+R). Vue replaces everything inside #app when it mounts.
    -->
    <div id="app" class="min-h-screen bg-dark-950">
      <div
        id="boot-fallback"
        style="color: #94a3b8; padding: 2rem; font-family: system-ui, sans-serif; text-align: center; max-width: 24rem; margin: 0 auto"
      >
        <p style="margin: 0 0 0.5rem; font-size: 1rem">Loading TapeOutOps…</p>
        <p style="margin: 0; font-size: 0.75rem; line-height: 1.4; opacity: 0.85">
          Stuck on this screen? Open DevTools (F12) → Console for errors, then hard refresh.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
